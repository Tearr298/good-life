<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#C2185B">
<title>กฎใช้ชีวิตร่วมกัน</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --deep:#C2185B; --rose:#FF6F91; --pink:#FF9EBB; --blush:#FFE3EC;
  --bg:#FFF7FA; --card:#FFFFFF; --ink:#2B1B22; --muted:#8E7480; --line:#F0DCE4;
  --ok:#12B886; --warn:#F08C00; --bad:#E03131;
  --sh:0 1px 2px rgba(120,40,70,.05),0 6px 18px rgba(120,40,70,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:contain}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans Thai","Sarabun",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.55;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
input,select{font:inherit}

/* หัวจอ */
.top{background:linear-gradient(135deg,var(--deep),#E23A76);color:#fff;
  padding:calc(14px + env(safe-area-inset-top)) 16px 16px;border-radius:0 0 20px 20px}
.top .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.top .who{font-size:18px;font-weight:700}
.top .date{font-size:11.5px;opacity:.85;margin-top:1px}
.gear{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.16);
  display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.stats{display:flex;gap:8px;margin-top:14px}
.stat{flex:1;background:rgba(255,255,255,.15);border-radius:14px;padding:9px 10px;min-width:0}
.stat .l{font-size:10px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v{font-size:19px;font-weight:800;line-height:1.25}
.stat .s{font-size:9.5px;opacity:.8}

.wrap{padding:12px 12px 0;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:13px;margin-bottom:10px}
.sec{font-size:11.5px;font-weight:700;color:var(--muted);margin:15px 5px 7px;letter-spacing:.4px}
.h{display:flex;align-items:flex-start;gap:10px}
.ic{font-size:22px;width:28px;text-align:center;flex:none;line-height:1.2}
.t{font-weight:700;font-size:14.5px}
.s{font-size:11px;color:var(--muted);margin-top:1px}
.pill{font-size:10.5px;font-weight:700;padding:4px 8px;border-radius:999px;white-space:nowrap;flex:none}
.p-ok{background:#E7F9F1;color:#0B8A62}.p-bad{background:#FDECEC;color:var(--bad)}
.p-warn{background:#FFF4E0;color:#B26A00}.p-idle{background:#F4EEF1;color:var(--muted)}
.p-ex{background:#EEF2FF;color:#4C6EF5}

.ctl{margin-top:11px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.step{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;flex:none;background:#fff}
.step button{width:42px;height:40px;font-size:20px;font-weight:600;color:var(--deep)}
.step button:active{background:var(--blush)}
.step .n{width:50px;text-align:center;font-weight:800;font-size:16px;line-height:40px;
  border-left:1px solid var(--line);border-right:1px solid var(--line)}
.unit{font-size:11.5px;color:var(--muted)}
.btn{height:42px;border-radius:12px;background:var(--deep);color:#fff;font-weight:700;font-size:14px;
  display:flex;align-items:center;justify-content:center;gap:6px;padding:0 16px}
.btn:active{opacity:.85}
.btn.wide{width:100%}
.btn.ghost{background:#F4EEF1;color:var(--ink)}
.btn.done{background:#E7F9F1;color:#0B8A62}
.btn.sm{height:34px;font-size:12.5px;border-radius:10px;padding:0 12px;flex:none}
.btn[disabled]{opacity:.5}
.dots{display:flex;gap:4px;align-items:center;margin-top:9px;flex-wrap:wrap}
.dot{width:20px;height:6px;border-radius:3px;background:#EFE3E8}
.dot.on{background:var(--ok)}
.note{font-size:11px;color:var(--muted);margin-top:8px}
.bar{height:11px;border-radius:6px;background:#F1E6EB;overflow:hidden;margin:9px 0 5px}
.bar>div{height:100%;background:linear-gradient(90deg,var(--deep),var(--rose));border-radius:6px;transition:width .4s}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;
  font-size:13px;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted);min-width:0}
.kv .v{font-weight:700;white-space:nowrap}
.v.red{color:var(--bad)}.v.green{color:#0B8A62}.v.warn{color:var(--warn)}
.big{font-size:28px;font-weight:800;letter-spacing:-.5px}
.mini{font-size:10.5px;color:var(--muted)}
.seg{display:flex;background:#F1E6EB;border-radius:12px;padding:3px;gap:3px;margin-bottom:11px}
.seg button{flex:1;height:32px;border-radius:9px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.07)}
.banner{border-radius:12px;padding:9px 11px;font-size:12px;margin-bottom:10px}
.b-warn{background:#FFF4E0;border:1px solid #FFD8A8;color:#8A5200}
.b-info{background:#EEF2FF;border:1px solid #D4DBFF;color:#3B4FA8}
.b-ok{background:#E7F9F1;border:1px solid #B6EBD8;color:#0B7A56}

/* ปฏิทิน */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-size:10px;color:var(--muted);font-weight:700}
.cell{aspect-ratio:1/1.05;border-radius:10px;background:#F7F1F4;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:12px;gap:1px;border:1.5px solid transparent}
.cell.empty{background:transparent}
.cell.ok{background:#E7F9F1;color:#0B8A62}
.cell.bad{background:#FDECEC;color:var(--bad)}
.cell.ex{background:#EEF2FF;color:#4C6EF5}
.cell.today{border-color:var(--deep)}
.cell .amt{font-size:9px;font-weight:800}
.calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.calnav button{width:34px;height:34px;border-radius:10px;background:#F4EEF1;font-size:16px}

/* ฟอร์ม */
.form{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.form label{font-size:11.5px;color:var(--muted);font-weight:600}
.form input,.form select{width:100%;height:42px;border:1px solid var(--line);border-radius:11px;
  padding:0 11px;background:#fff;color:var(--ink)}
.row2{display:flex;gap:8px}.row2>*{flex:1;min-width:0}

/* เมนูล่าง */
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
  display:flex;padding:5px 2px calc(5px + env(safe-area-inset-bottom));z-index:40}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:10px;color:var(--muted);padding:4px 0;font-weight:600}
.nav button .e{font-size:18px;line-height:1}
.nav button.on{color:var(--deep)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:#2B1B22;color:#fff;
  padding:10px 16px;border-radius:12px;font-size:13px;z-index:99;opacity:0;transition:.25s;
  pointer-events:none;max-width:88%;text-align:center}
#toast.show{opacity:1;bottom:102px}
.sheet{position:fixed;inset:0;background:rgba(40,15,25,.4);z-index:80;display:flex;align-items:flex-end}
.sheet>div{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.sheet h3{margin:0 0 6px;font-size:16px}
.hide{display:none!important}
.center{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.login{width:100%;max-width:340px;text-align:center}
.login h1{font-size:22px;margin:14px 0 4px}
.login p{color:var(--muted);font-size:13px;margin:0 0 18px}
.offline{position:fixed;top:0;left:0;right:0;background:var(--warn);color:#fff;font-size:11.5px;
  text-align:center;padding:3px;z-index:90}
.spin{width:30px;height:30px;border:3px solid #EFE3E8;border-top-color:var(--deep);
  border-radius:50%;animation:sp .8s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="offline" class="offline hide">ออฟไลน์ — กดได้ปกติ เดี๋ยวซิงก์ให้เมื่อเน็ตกลับมา</div>

<!-- หน้าล็อกอิน -->
<div id="auth" class="center">
  <div class="login">
    <div style="font-size:46px">🤝</div>
    <h1>กฎใช้ชีวิตร่วมกัน</h1>
    <p id="authHint">ใส่อีเมลและรหัสผ่าน</p>
    <div class="form" style="text-align:left">
      <div id="stepPw">
        <label>อีเมล</label>
        <input type="email" id="email" inputmode="email" autocomplete="username" placeholder="you@example.com">
        <label style="margin-top:10px">รหัสผ่าน</label>
        <input type="password" id="pw" autocomplete="current-password" placeholder="••••••••">
        <button class="btn wide" id="signIn" style="margin-top:12px">เข้าสู่ระบบ</button>
        <button class="btn ghost wide" id="toOtp" style="margin-top:8px">เข้าด้วยรหัส 6 หลักทางอีเมลแทน</button>
      </div>
      <div id="stepEmail" class="hide">
        <label>อีเมล</label>
        <input type="email" id="email2" inputmode="email" autocomplete="email" placeholder="you@example.com">
        <button class="btn wide" id="sendOtp" style="margin-top:10px">ส่งรหัสเข้าอีเมล</button>
        <button class="btn ghost wide" id="toPw" style="margin-top:8px">กลับไปใช้รหัสผ่าน</button>
      </div>
      <div id="stepOtp" class="hide">
        <label>รหัส 6 หลักที่ส่งไปทางอีเมล</label>
        <input type="text" id="otp" inputmode="numeric" maxlength="6" placeholder="123456"
               style="letter-spacing:6px;text-align:center;font-size:20px;font-weight:700">
        <button class="btn wide" id="verifyOtp" style="margin-top:10px">เข้าสู่ระบบ</button>
        <button class="btn ghost wide" id="backEmail" style="margin-top:8px">เปลี่ยนอีเมล</button>
      </div>
    </div>
    <div id="authMsg" class="mini" style="margin-top:12px"></div>
  </div>
</div>

<!-- แอป -->
<div id="app" class="hide">
  <div class="top">
    <div class="row">
      <div>
        <div class="who" id="hWho">—</div>
        <div class="date" id="hDate"></div>
      </div>
      <button class="gear" id="hGear">⚙️</button>
    </div>
    <div class="stats">
      <div class="stat"><div class="l">ค่าปรับวันนี้</div><div class="v"><span id="sDay">0</span> ฿</div><div class="s" id="sDayWho">ของเรา</div></div>
      <div class="stat"><div class="l">เสี่ยงสัปดาห์นี้</div><div class="v"><span id="sWeek">0</span> ฿</div><div class="s" id="sWeekNote">ยังแก้ทัน</div></div>
      <div class="stat"><div class="l">ค้างจ่ายเข้ากอง</div><div class="v"><span id="sDue">0</span> ฿</div><div class="s">ทั้งคู่</div></div>
    </div>
  </div>

  <div class="wrap">
    <div id="pgToday"></div>
    <div id="pgHistory" class="hide"></div>
    <div id="pgFines" class="hide"></div>
    <div id="pgFund" class="hide"></div>
    <div id="pgAdmin" class="hide"></div>
  </div>

  <div class="nav" id="nav">
    <button data-tab="today" class="on"><span class="e">✅</span>วันนี้</button>
    <button data-tab="history"><span class="e">📅</span>ย้อนหลัง</button>
    <button data-tab="fines"><span class="e">💸</span>ค่าปรับ</button>
    <button data-tab="fund"><span class="e">✈️</span>กองเงิน</button>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script>
/* ══════════════ ตั้งค่า ══════════════ */
const SB_URL = 'https://xllktzbfzmafpegxmset.supabase.co';
const SB_KEY = 'sb_publishable_5J2XB1C6bPZZ4hl2go30SA_9syGiVe8';
const sb = supabase.createClient(SB_URL, SB_KEY, { auth:{ persistSession:true, autoRefreshToken:true } });

/* ══════════════ ตัวช่วย ══════════════ */
const $ = s => document.querySelector(s);
const el = h => { const d=document.createElement('div'); d.innerHTML=h.trim(); return d.firstElementChild; };
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = n => Number(n||0).toLocaleString('en-US');
const TH_M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const thDate = d => { const p=String(d).split('-'); return +p[2]+' '+TH_M[+p[1]-1]+' '+(+p[0]+543-2500); };
const thMonth = ym => { const p=String(ym).split('-'); return TH_M[+p[1]-1]+' '+(+p[0]+543); };
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD = s => { const p=String(s).slice(0,10).split('-'); return new Date(+p[0],+p[1]-1,+p[2],12); };
const addD = (s,n) => { const d=parseD(s); d.setDate(d.getDate()+n); return iso(d); };
const diffD = (a,b) => Math.round((parseD(b)-parseD(a))/86400000);
const mondayOf = s => { const d=parseD(s), w=d.getDay(); return addD(s, -(w===0?6:w-1)); };
const ymOf = s => String(s).slice(0,7);
const lastDayOf = ym => { const y=+ym.slice(0,4), m=+ym.slice(5,7); return iso(new Date(y,m,0)); };
const hhmm = mins => pad(Math.floor((mins%1440)/60))+':'+pad(mins%60);

let toastT;
function toast(msg,ms=2400){ const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms); }

/* ══════════════ สถานะ ══════════════ */
const S = {
  me:null, members:[], rules:[], versions:[], settings:{}, round:null,
  logs:[], fines:[], payments:[], exemptions:[],
  tab:'today', histMonth:null, histMember:null, finesScope:'week', ready:false
};
const LS = {
  get(k,d){ try{ const v=localStorage.getItem('gl2_'+k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('gl2_'+k, JSON.stringify(v)); }catch(e){} }
};
const cfg = (k,d) => S.settings[k]!==undefined && S.settings[k]!=='' ? S.settings[k] : d;
const cutoff = () => Number(cfg('DAY_CUTOFF_HOUR',5));
function today(){ const d=new Date(); if(d.getHours()<cutoff()) d.setDate(d.getDate()-1); return iso(d); }
function rulesEnd(){ return String(cfg('RULES_END_DATE','')||'').slice(0,10); }
const afterEnd = d => { const e=rulesEnd(); return !!e && d>e; };

/* ══════════════ เครื่องคำนวณค่าปรับ ══════════════ */
function versionFor(ruleId, date){
  let best=null;
  for(const v of S.versions){
    if(v.rule_id!==ruleId) continue;
    if(String(v.effective_from).slice(0,10) > date) continue;
    if(!best || String(v.effective_from) > String(best.effective_from)) best=v;
  }
  return best;
}
function activeRules(date){
  return S.rules
    .filter(r => r.active !== false && (!r.ended_on || String(r.ended_on).slice(0,10) >= date))
    .map(r => ({ rule:r, v:versionFor(r.id,date) }))
    .filter(x => x.v)
    .sort((a,b)=>(a.rule.sort_order||0)-(b.rule.sort_order||0));
}
function isExempt(memberId, date, ruleId){
  for(const e of S.exemptions){
    const s=String(e.start_date).slice(0,10), en=String(e.end_date).slice(0,10);
    if(date<s||date>en) continue;
    if(e.member_id && e.member_id!==memberId) continue;
    if(e.rule_id && e.rule_id!==ruleId) continue;
    return e;
  }
  return null;
}
function logsOf(memberId, date, ruleId){
  return S.logs.filter(l => l.member_id===memberId && String(l.log_date).slice(0,10)===date &&
                            (!ruleId || l.rule_id===ruleId));
}
/** ค่าปรับที่ตัดสินได้ภายในวัน */
function dayFines(memberId, date){
  const out={ items:[], total:0 };
  if(afterEnd(date)) return out;
  for(const {rule,v} of activeRules(date)){
    if(v.period!=='DAY' && v.period!=='SESSION') continue;
    const ex = isExempt(memberId,date,rule.id);
    if(ex){ out.items.push({ruleId:rule.id,icon:rule.icon,name:rule.name,amount:0,detail:'ยกเว้น: '+ex.reason,status:'exempt'}); continue; }
    const rows = logsOf(memberId,date,rule.id);
    let amount=0, detail='', status='ok';
    if(v.kind==='DEADLINE'){
      if(!rows.length){ amount=+v.fine; detail='ไม่ได้บันทึกเวลานอน'; status='miss'; }
      else{
        let got=+rows[0].value; if(got < cutoff()*60) got+=1440;
        if(got > +v.target){ amount=+v.fine; detail='นอน '+hhmm(+rows[0].value)+' (เกิน '+hhmm(+v.target)+')'; status='over'; }
        else detail='นอน '+hhmm(+rows[0].value);
      }
    }else if(v.kind==='MIN'){
      const n = rows.reduce((s,l)=>s+ +l.value,0);
      const short = Math.max(0, +v.target - n);
      if(short>0){ amount = v.fine_mode==='FLAT' ? +v.fine : short*+v.fine; status='miss'; }
      detail = fmtNum(n)+'/'+fmtNum(v.target)+' '+v.unit + (v.unit==='แก้ว'&&+v.target===8 ? ' ('+(n*0.25).toFixed(2).replace(/0$/,'')+' ล.)' : '');
    }else{ // LIMIT
      if(v.period==='SESSION'){
        let over=0, sum=0;
        rows.forEach(l=>{ over += Math.max(0, +l.value - +v.target); sum += +l.value; });
        amount = v.fine_mode==='FLAT' ? (over?+v.fine:0) : over*+v.fine;
        detail = rows.length ? rows.length+' ครั้ง · รวม '+sum+' '+v.unit+(over?' (เกิน '+over+')':'') : 'ไม่ได้ดื่ม';
        if(over) status='over';
      }else{
        const n = rows.reduce((s,l)=>s+ +l.value,0);
        const over = Math.max(0, n - +v.target);
        amount = v.fine_mode==='FLAT' ? (over?+v.fine:0) : over*+v.fine;
        detail = fmtNum(n)+' '+v.unit+(over?' (เกิน '+fmtNum(over)+')':'');
        if(over) status='over';
      }
    }
    out.total += amount;
    out.items.push({ruleId:rule.id,icon:rule.icon,name:rule.name,amount,detail,status,v});
  }
  return out;
}
function fmtNum(n){ n=Number(n); return Number.isInteger(n)? String(n) : String(Math.round(n*100)/100); }

/** โควตารายสัปดาห์ — แยก "แน่นอนแล้ว" กับ "ยังเสี่ยง" */
function weekStatus(memberId, monday, refDate){
  const sunday = addD(monday,6);
  const ref = refDate || today();
  const out={ items:[], confirmed:0, atRisk:0 };
  if(afterEnd(monday)) return out;
  for(const {rule,v} of activeRules(monday)){
    if(v.period!=='WEEK') continue;
    let exDays=0, d=monday;
    while(d<=sunday){ if(isExempt(memberId,d,rule.id)||afterEnd(d)) exDays++; d=addD(d,1); }
    const need = Math.max(0, +v.target - (v.day_threshold ? exDays : (exDays>=7?+v.target:0)));
    let got=0;
    if(v.day_threshold){
      const days={};
      S.logs.forEach(l=>{ const dd=String(l.log_date).slice(0,10);
        if(l.member_id===memberId && l.rule_id===rule.id && dd>=monday && dd<=sunday && +l.value >= +v.day_threshold) days[dd]=1; });
      got = Object.keys(days).length;
    }else{
      S.logs.forEach(l=>{ const dd=String(l.log_date).slice(0,10);
        if(l.member_id===memberId && l.rule_id===rule.id && dd>=monday && dd<=sunday) got += +l.value; });
    }
    const short = Math.max(0, need-got);
    const daysLeft = ref>sunday ? 0 : Math.max(0, diffD(ref,sunday)+1);
    const canStillGet = v.day_threshold ? daysLeft : (daysLeft>0 ? 999 : 0);
    const unavoidable = Math.max(0, short - canStillGet);
    const unit = v.fine_mode==='FLAT' ? (x=>x>0?+v.fine:0) : (x=>x*+v.fine);
    const confirmed = unit(unavoidable);
    const risk = Math.max(0, unit(short) - confirmed);
    out.confirmed += confirmed; out.atRisk += risk;
    out.items.push({ ruleId:rule.id, icon:rule.icon, name:rule.name, got, need, daysLeft,
                     confirmed, atRisk:risk, unit:v.unit, closed: daysLeft===0 });
  }
  return out;
}
function monthFines(memberId, ym, refDate){
  const from = ym+'-01'; let to = lastDayOf(ym);
  const e = rulesEnd(); if(e && e<to) to=e;
  const out={ items:[], total:0 };
  if(e && from>e) return out;
  for(const {rule,v} of activeRules(from)){
    if(v.period!=='MONTH') continue;
    let n=0;
    S.logs.forEach(l=>{ const d=String(l.log_date).slice(0,10);
      if(l.member_id===memberId && l.rule_id===rule.id && d>=from && d<=to && !isExempt(memberId,d,rule.id)) n += +l.value; });
    const over = Math.max(0, n - +v.target);
    const amount = v.fine_mode==='FLAT' ? (over?+v.fine:0) : over*+v.fine;
    out.total += amount;
    out.items.push({ ruleId:rule.id, icon:rule.icon, name:rule.name, amount, detail:n+' '+v.unit+'/เดือน'+(over?' (เกิน '+over+')':'') });
  }
  return out;
}
/** ยอดที่ปิดแล้วจากตาราง fines */
function settledTotals(){
  const per={};
  S.members.forEach(m=>per[m.id]={name:m.name, fines:0, paid:0});
  S.fines.forEach(f=>{ if(per[f.member_id]) per[f.member_id].fines += +f.amount; });
  S.payments.forEach(p=>{ if(per[p.member_id]) per[p.member_id].paid += +p.amount; });
  let fines=0, paid=0;
  Object.values(per).forEach(p=>{ p.due = p.fines-p.paid; fines+=p.fines; paid+=p.paid; });
  return { per, fines, paid, due: fines-paid };
}

/* ══════════════ ปิดยอดย้อนหลัง (ทำเองในแอป) ══════════════ */
async function settleOldPeriods(){
  const t = today();
  const rows=[];
  const seen = new Set(S.fines.map(f=>f.period_type+'|'+f.period_key+'|'+f.member_id+'|'+f.rule_id));
  const start = S.round ? String(S.round.start_date).slice(0,10) : addD(t,-30);
  for(const m of S.members){
    // รายวัน: ทุกวันก่อนวันนี้
    let d = start;
    while(d < t){
      if(!S.fines.some(f=>f.period_type==='DAY'&&f.period_key===d&&f.member_id===m.id)){
        dayFines(m.id,d).items.forEach(it=>{
          if(!it.amount) return;
          const k='DAY|'+d+'|'+m.id+'|'+it.ruleId;
          if(seen.has(k)) return; seen.add(k);
          rows.push({period_type:'DAY',period_key:d,incurred_on:d,member_id:m.id,rule_id:it.ruleId,
                     amount:it.amount,detail:it.detail,round_id:S.round?.id});
        });
      }
      d = addD(d,1);
    }
    // รายสัปดาห์: สัปดาห์ที่จบไปแล้ว
    let mon = mondayOf(start);
    while(addD(mon,6) < t){
      const w = weekStatus(m.id, mon, addD(mon,7));
      w.items.forEach(it=>{
        const amt = it.confirmed + it.atRisk;
        if(!amt) return;
        const k='WEEK|'+mon+'|'+m.id+'|'+it.ruleId;
        if(seen.has(k)) return; seen.add(k);
        rows.push({period_type:'WEEK',period_key:mon,incurred_on:addD(mon,6),member_id:m.id,rule_id:it.ruleId,
                   amount:amt,detail:'ทำได้ '+it.got+'/'+it.need+' '+it.unit,round_id:S.round?.id});
      });
      mon = addD(mon,7);
    }
    // รายเดือน: เดือนที่จบไปแล้ว
    let ym = ymOf(start);
    while(ym < ymOf(t)){
      monthFines(m.id,ym).items.forEach(it=>{
        if(!it.amount) return;
        const k='MONTH|'+ym+'|'+m.id+'|'+it.ruleId;
        if(seen.has(k)) return; seen.add(k);
        rows.push({period_type:'MONTH',period_key:ym,incurred_on:lastDayOf(ym),member_id:m.id,rule_id:it.ruleId,
                   amount:it.amount,detail:it.detail,round_id:S.round?.id});
      });
      const d2=parseD(ym+'-01'); d2.setMonth(d2.getMonth()+1); ym=ymOf(iso(d2));
    }
  }
  if(!rows.length) return 0;
  const { error } = await sb.from('fines').upsert(rows,{onConflict:'period_type,period_key,member_id,rule_id',ignoreDuplicates:true});
  if(error){ console.warn('settle',error); return 0; }
  const { data } = await sb.from('fines').select('*').eq('round_id', S.round?.id);
  if(data) S.fines = data;
  return rows.length;
}

/* ══════════════ คิวเขียน (ใช้ได้ตอนเน็ตหลุด) ══════════════ */
let outbox = LS.get('outbox',[]);
function queue(op){ outbox.push(op); LS.set('outbox',outbox); flush(); }
let flushing=false;
async function flush(){
  if(flushing || !navigator.onLine || !outbox.length) return;
  flushing=true;
  while(outbox.length){
    const op = outbox[0];
    try{
      if(op.t==='log'){
        const { error } = await sb.from('logs').upsert(op.row,{onConflict:'log_date,member_id,rule_id,seq'});
        if(error) throw error;
      }else if(op.t==='del'){
        const { error } = await sb.from('logs').delete()
          .eq('log_date',op.row.log_date).eq('member_id',op.row.member_id)
          .eq('rule_id',op.row.rule_id).eq('seq',op.row.seq);
        if(error) throw error;
      }else if(op.t==='pay'){
        const { error } = await sb.from('payments').insert(op.row); if(error) throw error;
      }
      outbox.shift(); LS.set('outbox',outbox);
    }catch(e){
      console.warn('flush',e); flushing=false; setTimeout(flush,4000); return;
    }
  }
  flushing=false; updateOffline();
}
function updateOffline(){
  const bad = !navigator.onLine || outbox.length>0;
  $('#offline').classList.toggle('hide', !bad);
  $('#offline').textContent = !navigator.onLine
    ? 'ออฟไลน์ — กดได้ปกติ เดี๋ยวซิงก์ให้เมื่อเน็ตกลับมา'
    : 'กำลังซิงก์ ' + outbox.length + ' รายการ…';
}
addEventListener('online', ()=>{ updateOffline(); flush(); });
addEventListener('offline', updateOffline);

/* ══════════════ บันทึกการกด ══════════════ */
const timers = {};
function setLog(ruleId, value, seq=0, date=today()){
  const mid = S.me.id;
  let l = S.logs.find(x=>x.member_id===mid && String(x.log_date).slice(0,10)===date && x.rule_id===ruleId && (x.seq||0)===seq);
  if(l) l.value = value;
  else S.logs.push({ log_date:date, member_id:mid, rule_id:ruleId, value, seq });
  LS.set('logs', S.logs);
  render();
  clearTimeout(timers[ruleId+'|'+seq]);
  timers[ruleId+'|'+seq] = setTimeout(()=>{
    queue({t:'log', row:{ log_date:date, member_id:mid, rule_id:ruleId, value:Number(value), seq }});
  }, 500);
}
function delLog(ruleId, seq, date=today()){
  const mid=S.me.id;
  S.logs = S.logs.filter(x=>!(x.member_id===mid && String(x.log_date).slice(0,10)===date && x.rule_id===ruleId && (x.seq||0)===seq));
  LS.set('logs',S.logs); render();
  queue({t:'del', row:{ log_date:date, member_id:mid, rule_id:ruleId, seq }});
}

/* ══════════════ โหลดข้อมูล ══════════════ */
async function loadAll(){
  const from = addD(today(),-75);
  const [mem,rul,ver,set,rnd,lg,ex] = await Promise.all([
    sb.from('members').select('*').order('id'),
    sb.from('rules').select('*').order('sort_order'),
    sb.from('rule_versions').select('*'),
    sb.from('settings').select('*'),
    sb.from('rounds').select('*').eq('status','active').limit(1),
    sb.from('logs').select('*').gte('log_date',from),
    sb.from('exemptions').select('*')
  ]);
  S.members = mem.data||[]; S.rules = rul.data||[]; S.versions = ver.data||[];
  S.settings = {}; (set.data||[]).forEach(r=>S.settings[r.key]=r.value);
  S.round = (rnd.data||[])[0]||null;
  S.logs = lg.data||[]; S.exemptions = ex.data||[];
  if(S.round){
    const [fn,py] = await Promise.all([
      sb.from('fines').select('*').eq('round_id',S.round.id),
      sb.from('payments').select('*').eq('round_id',S.round.id).order('paid_on',{ascending:false})
    ]);
    S.fines = fn.data||[]; S.payments = py.data||[];
  }
  LS.set('cache',{members:S.members,rules:S.rules,versions:S.versions,settings:S.settings,
                  round:S.round,logs:S.logs,exemptions:S.exemptions,fines:S.fines,payments:S.payments});
  S.ready = true;
}
function loadCache(){
  const c = LS.get('cache',null); if(!c) return false;
  Object.assign(S,{members:c.members||[],rules:c.rules||[],versions:c.versions||[],settings:c.settings||{},
                   round:c.round||null,logs:c.logs||[],exemptions:c.exemptions||[],
                   fines:c.fines||[],payments:c.payments||[]});
  return S.rules.length>0;
}
function subscribeLive(){
  sb.channel('gl').on('postgres_changes',{event:'*',schema:'public',table:'logs'}, p=>{
    const r = p.new || p.old; if(!r) return;
    if(r.member_id === S.me.id) return;               // ของตัวเองอัปเดตในเครื่องแล้ว
    if(p.eventType==='DELETE'){
      S.logs = S.logs.filter(x=>!(x.member_id===r.member_id&&x.log_date===r.log_date&&x.rule_id===r.rule_id&&(x.seq||0)===(r.seq||0)));
    }else{
      const i = S.logs.findIndex(x=>x.member_id===r.member_id&&String(x.log_date).slice(0,10)===String(r.log_date).slice(0,10)&&x.rule_id===r.rule_id&&(x.seq||0)===(r.seq||0));
      if(i>=0) S.logs[i]=r; else S.logs.push(r);
    }
    render();
  }).on('postgres_changes',{event:'*',schema:'public',table:'payments'}, async ()=>{
    if(!S.round) return;
    const { data } = await sb.from('payments').select('*').eq('round_id',S.round.id).order('paid_on',{ascending:false});
    if(data){ S.payments=data; render(); }
  }).subscribe();
}

function subText(v){
  const f = v.fine_mode==='FLAT' ? 'ไม่ถึงปรับ '+v.fine+' ฿' : 'หน่วยละ '+v.fine+' ฿';
  if(v.kind==='DEADLINE') return 'ไม่เกิน '+hhmm(+v.target)+' น. · เกินปรับ '+v.fine+' ฿';
  if(v.kind==='MIN') return 'ต้องได้ '+fmtNum(v.target)+' '+v.unit+
        (v.period==='WEEK'?'/สัปดาห์':'/วัน')+(v.day_threshold?' (วันละ ≥'+v.day_threshold+' นาที)':'')+' · '+f;
  const per = v.period==='SESSION'?'/ครั้ง':v.period==='MONTH'?'/เดือน':'/วัน';
  return 'ไม่เกิน '+fmtNum(v.target)+' '+v.unit+per+' · เกิน'+v.unit+'ละ '+v.fine+' ฿';
}
function pillFor(it){
  if(!it) return '<span class="pill p-idle">—</span>';
  if(it.status==='exempt') return '<span class="pill p-ex">ยกเว้น</span>';
  if(it.amount>0) return '<span class="pill p-bad">+'+num(it.amount)+' ฿</span>';
  if(it.status==='miss') return '<span class="pill p-idle">ยังไม่ทำ</span>';
  return '<span class="pill p-ok">ผ่าน</span>';
}
function ruleCard(x, item, monthly){
  const {rule,v} = x;
  const card = el('<div class="card"><div class="h"><div class="ic">'+(rule.icon||'•')+'</div>'+
    '<div style="flex:1;min-width:0"><div class="t">'+esc(rule.name)+'</div><div class="s">'+esc(subText(v))+'</div></div>'+
    pillFor(item)+'</div><div class="body"></div></div>');
  card.querySelector('.body').appendChild(control(rule,v,item,monthly));
  return card;
}
function control(rule,v,item,monthly){
  const t=today(), box=el('<div class="ctl"></div>');
  const rows = logsOf(S.me.id,t,rule.id);
  if(afterEnd(t)) return el('<div class="note">กติกาสิ้นสุดแล้ว</div>');

  if(v.kind==='DEADLINE'){
    if(rows.length) box.appendChild(el('<div class="btn done wide">🛌 บันทึกแล้ว '+hhmm(+rows[0].value)+' น.</div>'));
    else{
      const b=el('<button class="btn wide">🛌 กดตอนเข้านอน</button>');
      b.onclick=()=>{ const d=new Date(); setLog(rule.id, d.getHours()*60+d.getMinutes()); toast('บันทึกเวลานอนแล้ว'); };
      box.appendChild(b);
    }
    return box;
  }
  if(v.kind==='MIN' && +v.target===1 && v.period==='DAY'){
    const done = rows.length && +rows[0].value>0;
    const b=el('<button class="btn '+(done?'done':'')+' wide">'+(done?'✓ '+esc(rule.name)+'แล้ววันนี้':'กดเมื่อ'+esc(rule.name)+'แล้ว')+'</button>');
    b.onclick=()=>{ setLog(rule.id, done?0:1); toast(done?'ยกเลิกแล้ว':'บันทึกแล้ว'); };
    box.appendChild(b); return box;
  }
  if(v.period==='SESSION'){
    const wrap=el('<div style="width:100%"></div>');
    const add=el('<button class="btn wide">🥂 บันทึกวงที่ดื่ม</button>');
    add.onclick=()=>sessionSheet(rule,v,rows.length);
    wrap.appendChild(add);
    if(rows.length){
      const chips=el('<div class="ctl"></div>');
      rows.sort((a,b)=>(a.seq||0)-(b.seq||0)).forEach((l,i)=>{
        const c=el('<div class="pill p-idle" style="font-size:12px;padding:6px 10px">วงที่ '+(i+1)+' · <b>'+l.value+'</b> '+v.unit+' ✕</div>');
        c.onclick=()=>{ delLog(rule.id,l.seq||0); toast('ลบแล้ว'); };
        chips.appendChild(c);
      });
      wrap.appendChild(chips);
    }
    box.appendChild(wrap); return box;
  }
  // ตัวนับทั่วไป (LIMIT/DAY, LIMIT/MONTH, MIN/DAY เป้า>1)

  const st = stepper(cur, 0, 99, +v.step||1, val=>setLog(rule.id,val));
  box.appendChild(st);
  box.appendChild(el('<span class="unit">'+esc(v.unit)+(monthly?'วันนี้':'')+'</span>'));
  if(v.kind==='MIN'){
    const dots=el('<div class="dots" style="width:100%"></div>');
    for(let i=0;i<+v.target;i++) dots.appendChild(el('<div class="dot'+(i<cur?' on':'')+'"></div>'));
    dots.appendChild(el('<span class="unit" style="margin-left:5px">'+cur+'/'+fmtNum(v.target)+'</span>'));
    box.appendChild(dots);
  }
  if(monthly){
    const mo = monthFines(S.me.id, ymOf(t)).items.find(i=>i.ruleId===rule.id);
    if(mo) box.appendChild(el('<div class="note" style="width:100%">เดือนนี้: '+esc(mo.detail)+'</div>'));
  }
  return box;
}
function weekCard(x, it){
  const {rule,v}=x;
  const pill = !it ? '' : it.confirmed>0
      ? '<span class="pill p-bad">+'+num(it.confirmed)+' ฿</span>'
      : it.atRisk>0 ? '<span class="pill p-warn">เสี่ยง '+num(it.atRisk)+' ฿</span>'
      : '<span class="pill p-ok">ผ่าน</span>';
  const card = el('<div class="card"><div class="h"><div class="ic">'+(rule.icon||'•')+'</div>'+
    '<div style="flex:1;min-width:0"><div class="t">'+esc(rule.name)+'</div><div class="s">'+esc(subText(v))+'</div></div>'+
    pill+'</div><div class="body"></div></div>');
  const body = card.querySelector('.body');
  const t=today(), rows=logsOf(S.me.id,t,rule.id);
  const cur = rows.length? +rows[0].value : 0;

  if(v.day_threshold){
    if(cur >= +v.day_threshold){
      const b=el('<div class="btn done wide" style="margin-top:11px">✓ วันนี้ทำแล้ว '+cur+' นาที</div>');
      b.onclick=()=>{ setLog(rule.id,0); };
      body.appendChild(b);
    }else{
      let mins = +v.day_threshold;
      const line=el('<div class="ctl"></div>');
      line.appendChild(stepper(mins,0,300,+v.step||5,val=>{mins=val;}));
      line.appendChild(el('<span class="unit">นาที</span>'));
      const b=el('<button class="btn sm">บันทึก</button>');
      b.onclick=()=>{ setLog(rule.id,mins); toast('บันทึก '+mins+' นาที'); };
      line.appendChild(b); body.appendChild(line);
    }
  }else{
    const line=el('<div class="ctl"></div>');
    line.appendChild(stepper(cur,0,20,1,val=>setLog(rule.id,val)));
    line.appendChild(el('<span class="unit">'+esc(v.unit)+'วันนี้</span>'));
    body.appendChild(line);
  }
  if(it){
    const dots=el('<div class="dots"></div>');
    for(let i=0;i<Math.max(it.need,it.got,1);i++) dots.appendChild(el('<div class="dot'+(i<it.got?' on':'')+'"></div>'));
    dots.appendChild(el('<span class="unit" style="margin-left:5px">'+it.got+'/'+it.need+' '+it.unit+
      (it.closed?' · จบสัปดาห์แล้ว':' · เหลือ '+it.daysLeft+' วัน')+'</span>'));
    body.appendChild(dots);
    if(it.atRisk>0 && it.confirmed===0)
      body.appendChild(el('<div class="note">ยังทันอยู่ ถ้าทำครบจะไม่โดนปรับ '+num(it.atRisk)+' ฿</div>'));
    if(it.confirmed>0)
      body.appendChild(el('<div class="note" style="color:var(--bad)">เหลือวันไม่พอแล้ว โดนแน่ '+num(it.confirmed)+' ฿</div>'));
  }
  return card;
}
function stepper(value,min,max,step,onChange){
  const box=el('<div class="step"><button class="m">−</button><div class="n">'+fmtNum(value)+'</div><button class="p">＋</button></div>');
  const n=box.querySelector('.n'); let v=value;
  const set=d=>{ const nv=Math.min(max,Math.max(min,Math.round((v+d)*100)/100)); if(nv===v) return;
                 v=nv; n.textContent=fmtNum(v); onChange(v); };
  box.querySelector('.m').onclick=()=>set(-step);
  box.querySelector('.p').onclick=()=>set(step);
  return box;
}
function sessionSheet(rule,v,nextSeq){

  const sh=el('<div class="sheet"><div><h3>'+(rule.icon||'')+' '+esc(rule.name)+'</h3>'+

  sh.querySelector('#x').onclick=()=>sh.remove();

/* ---------- แท็บ 2 : ย้อนหลัง ---------- */
function renderHistory(){
  const box=$('#pgHistory'); box.innerHTML='';
  const t=today();
  S.histMonth = S.histMonth || ymOf(t);
  S.histMember = S.histMember || S.me.id;

  if(S.members.length>1){
    const seg=el('<div class="seg"></div>');
    S.members.forEach(m=>{
      const b=el('<button class="'+(m.id===S.histMember?'on':'')+'">'+esc(m.name)+'</button>');
      b.onclick=()=>{ S.histMember=m.id; renderHistory(); };
      seg.appendChild(b);
    });
    box.appendChild(seg);
  }
  const card=el('<div class="card"></div>');
  const nav=el('<div class="calnav"><button id="pm">‹</button><b>'+thMonth(S.histMonth)+'</b><button id="nm">›</button></div>');
  card.appendChild(nav);
  const cal=el('<div class="cal"></div>');
  ['จ','อ','พ','พฤ','ศ','ส','อา'].forEach(d=>cal.appendChild(el('<div class="dow">'+d+'</div>')));
  const first=parseD(S.histMonth+'-01'); let lead=first.getDay()===0?6:first.getDay()-1;
  for(let i=0;i<lead;i++) cal.appendChild(el('<div class="cell empty"></div>'));
  const last=lastDayOf(S.histMonth);
  let d=S.histMonth+'-01', totalMonth=0;
  while(d<=last){
    if(d<=t){
      const f=dayFines(S.histMember,d);
      const exHit=isExempt(S.histMember,d,null);
      totalMonth+=f.total;
      const cls = exHit?'ex':(f.total>0?'bad':'ok');
      const c=el('<div class="cell '+cls+(d===t?' today':'')+'"><div>'+(+d.slice(8))+'</div>'+
                 '<div class="amt">'+(exHit?'ยกเว้น':(f.total?f.total+'฿':'✓'))+'</div></div>');
      const dd=d; c.onclick=()=>daySheet(dd,f,exHit);
      cal.appendChild(c);
    }else cal.appendChild(el('<div class="cell empty"></div>'));
    d=addD(d,1);
  }
  card.appendChild(cal);
  card.appendChild(el('<div class="note">🟩 รอด · 🟥 โดนปรับ · 🟦 ยกเว้น — แตะดูรายละเอียดได้</div>'));
  box.appendChild(card);
  nav.querySelector('#pm').onclick=()=>{ S.histMonth=shiftM(S.histMonth,-1); renderHistory(); };
  nav.querySelector('#nm').onclick=()=>{ S.histMonth=shiftM(S.histMonth, 1); renderHistory(); };

  // โควตาสัปดาห์ในเดือนนี้
  let sum=totalMonth;
  const wkCard=el('<div class="card"><div class="sec" style="margin:0 0 4px">โควตารายสัปดาห์</div></div>');
  let mon=mondayOf(S.histMonth+'-01');
  while(mon<=last){
    if(mon<=t){
      const w=weekStatus(S.histMember,mon);
      const amt=w.confirmed+(addD(mon,6)<t? w.atRisk:0);
      sum+=amt;
      wkCard.appendChild(el('<div class="kv"><div class="k">'+thDate(mon)+' – '+thDate(addD(mon,6))+
        '<div class="mini">'+w.items.map(i=>i.icon+' '+i.got+'/'+i.need).join(' · ')+'</div></div>'+
        '<div class="v '+(amt?'red':'green')+'">'+(amt?num(amt)+' ฿':'✓')+'</div></div>'));
    }
    mon=addD(mon,7);
  }
  box.appendChild(wkCard);
  box.appendChild(el('<div class="card"><div class="kv"><div class="k">รวมเดือนนี้ของ '+esc(nameOf(S.histMember))+
    '</div><div class="v red">'+num(sum)+' ฿</div></div></div>'));
}
const shiftM=(ym,d)=>{ let y=+ym.slice(0,4),m=+ym.slice(5,7)+d; if(m<1){m=12;y--;} if(m>12){m=1;y++;} return y+'-'+pad(m); };
const nameOf=id=>{ const m=S.members.find(x=>x.id===id); return m?m.name:id; };
function daySheet(date,f,ex){
  const rows=(f.items||[]).map(i=>'<div class="kv"><div class="k">'+(i.icon||'')+' '+esc(i.name)+
    '<div class="mini">'+esc(i.detail)+'</div></div><div class="v '+(i.amount?'red':'green')+'">'+
    (i.amount?'+'+i.amount+' ฿':'✓')+'</div></div>').join('');
  const sh=el('<div class="sheet"><div><h3>'+thDate(date)+'</h3>'+
    (ex?'<div class="banner b-info">🏷️ ยกเว้น: '+esc(ex.reason)+'</div>':'')+rows+
    '<button class="btn ghost wide" style="margin-top:12px" id="c">ปิด</button></div></div>');
  sh.querySelector('#c').onclick=()=>sh.remove();
  sh.onclick=e=>{ if(e.target===sh) sh.remove(); };
  document.body.appendChild(sh);
}

/* ---------- แท็บ 3 : ค่าปรับ ---------- */
function renderFines(){
  const box=$('#pgFines'); box.innerHTML='';
  const t=today();
  const scopes={ week:['สัปดาห์นี้',mondayOf(t),addD(mondayOf(t),6)],
                 lastweek:['สัปดาห์ที่แล้ว',addD(mondayOf(t),-7),addD(mondayOf(t),-1)],
                 month:['เดือนนี้',ymOf(t)+'-01',lastDayOf(ymOf(t))],
                 round:['ทั้งรอบ',S.round?String(S.round.start_date).slice(0,10):'2000-01-01','2999-12-31'] };
  const seg=el('<div class="seg"></div>');
  Object.keys(scopes).forEach(k=>{
    const b=el('<button class="'+(S.finesScope===k?'on':'')+'">'+scopes[k][0]+'</button>');
    b.onclick=()=>{ S.finesScope=k; renderFines(); }; seg.appendChild(b);
  });
  box.appendChild(seg);
  const [label,from,to]=scopes[S.finesScope];
  box.appendChild(el('<div class="mini" style="margin:-4px 4px 9px">'+label+' · '+thDate(from)+' – '+thDate(to>t?t:to)+'</div>'));

  let grand=0;
  S.members.forEach(m=>{
    const byRule={}; let settled=0, open=0;
    S.fines.forEach(f=>{
      if(f.member_id!==m.id) return;
      const d=String(f.incurred_on).slice(0,10);
      if(d<from||d>to) return;
      settled+= +f.amount; byRule[f.rule_id]=(byRule[f.rule_id]||0)+ +f.amount;
    });
    // ช่วงที่ยังไม่ปิดยอด
    let d=from;
    while(d<=to && d<=t){
      if(!S.fines.some(f=>f.period_type==='DAY'&&f.period_key===d&&f.member_id===m.id)){
        dayFines(m.id,d).items.forEach(i=>{ if(i.amount){ open+=i.amount; byRule[i.ruleId]=(byRule[i.ruleId]||0)+i.amount; } });
      }
      d=addD(d,1);
    }
    let mon=mondayOf(from);
    while(mon<=to){
      if(!S.fines.some(f=>f.period_type==='WEEK'&&f.period_key===mon&&f.member_id===m.id)){
        const w=weekStatus(m.id,mon);
        w.items.forEach(i=>{ if(i.confirmed){ open+=i.confirmed; byRule[i.ruleId]=(byRule[i.ruleId]||0)+i.confirmed; } });
      }
      mon=addD(mon,7);
    }
    const total=settled+open; grand+=total;
    const list=Object.keys(byRule).sort().map(rid=>{
      const r=S.rules.find(x=>x.id===rid);
      return '<div class="kv"><div class="k">'+(r?r.icon+' '+esc(r.name):rid)+'</div>'+
             '<div class="v red">'+num(byRule[rid])+' ฿</div></div>';
    }).join('') || '<div class="mini" style="padding:7px 0">ยังไม่โดนปรับในงวดนี้ 🎉</div>';
    box.appendChild(el('<div class="card"><div class="h"><div class="ic">'+(total?'😅':'😇')+'</div>'+
      '<div style="flex:1"><div class="t">'+esc(m.name)+'</div><div class="s">ปิดยอดแล้ว '+num(settled)+
      ' ฿'+(open?' · ยังไม่ปิด '+num(open)+' ฿':'')+'</div></div>'+
      '<div class="big" style="color:'+(total?'var(--bad)':'#0B8A62')+'">'+num(total)+'</div></div>'+
      '<div style="margin-top:6px">'+list+'</div></div>'));
  });
  box.appendChild(el('<div class="card"><div class="kv"><div class="k">รวมทั้งคู่</div>'+
    '<div class="v red">'+num(grand)+' ฿</div></div>'+
    '<div class="note">ยอด "ยังไม่ปิด" คือของวันที่ระบบยังไม่สรุป จะปิดให้อัตโนมัติเมื่อข้ามวัน</div></div>'));
}

function ruleSheet(rule, v){
  const isNew=!rule;
  const t=today();
  const kinds=[['MIN','ต้องได้อย่างน้อย'],['LIMIT','ห้ามเกิน'],['DEADLINE','เส้นตายเวลา']];
  const pers=[['DAY','ต่อวัน'],['WEEK','ต่อสัปดาห์'],['MONTH','ต่อเดือน'],['SESSION','ต่อครั้ง']];
  const modes=[['FLAT','เหมา (ผิดก็ปรับเท่านี้)'],['PER_UNIT','ตามหน่วยที่เกิน/ขาด']];
  const opt=(arr,sel)=>arr.map(([k,l])=>'<option value="'+k+'"'+(k===sel?' selected':'')+'>'+l+'</option>').join('');
  const sh=el('<div class="sheet"><div><h3>'+(isNew?'➕ เพิ่มกติกาใหม่':'✏️ '+esc(rule.name))+'</h3>'+
    '<div class="mini">แก้ค่าปรับจะมีผลตั้งแต่วันนี้เป็นต้นไป ประวัติเก่าคงเดิม</div>'+
    '<div class="form">'+
    '<div class="row2"><div style="flex:0 0 84px"><label>ไอคอน</label><input type="text" id="ric" maxlength="4" value="'+esc(rule?.icon||'⭐')+'"></div>'+
    '<div><label>ชื่อกติกา</label><input type="text" id="rnm" value="'+esc(rule?.name||'')+'" placeholder="เช่น ดื่มน้ำ"></div></div>'+
    '<div class="row2"><div><label>ทิศทาง</label><select id="rk">'+opt(kinds,v?.kind||'MIN')+'</select></div>'+
    '<div><label>รอบ</label><select id="rp">'+opt(pers,v?.period||'DAY')+'</select></div></div>'+
    '<div class="row2"><div><label>เป้า / เพดาน</label><input type="number" step="any" id="rt" value="'+(v?.target??1)+'"></div>'+
    '<div><label>หน่วย</label><input type="text" id="ru" value="'+esc(v?.unit||'ครั้ง')+'"></div></div>'+
    '<div class="row2"><div><label>วิธีปรับ</label><select id="rm">'+opt(modes,v?.fine_mode||'FLAT')+'</select></div>'+
    '<div><label>ค่าปรับ (บาท)</label><input type="number" step="any" id="rf" value="'+(v?.fine??5)+'"></div></div>'+
    '<div class="mini" id="hint"></div>'+
    '<div class="row2"><button class="btn ghost" id="x">ยกเลิก</button><button class="btn" id="ok">บันทึก</button></div>'+
    '</div></div></div>');
  const hint=()=>{
    const k=sh.querySelector('#rk').value, p=sh.querySelector('#rp').value;
    sh.querySelector('#hint').textContent =
      k==='DEADLINE' ? 'เส้นตายเวลา: ใส่เป้าเป็นนาทีจากเที่ยงคืน เช่น 23:00 = 1380'
      : k==='MIN' && p==='WEEK' ? 'ต้องได้กี่ครั้ง/วันต่อสัปดาห์ เช่น ออกกำลังกาย 3 วัน'
      : k==='MIN' ? 'ต้องได้อย่างน้อยเท่านี้ต่อวัน เช่น ดื่มน้ำ 8 แก้ว'
      : 'ห้ามเกินเท่านี้ เกินแล้วปรับ';
  };
  sh.querySelector('#rk').onchange=hint; sh.querySelector('#rp').onchange=hint; hint();
  sh.querySelector('#x').onclick=()=>sh.remove();
  sh.querySelector('#ok').onclick=async()=>{
    const name=sh.querySelector('#rnm').value.trim();
    if(!name) return toast('ใส่ชื่อกติกาก่อน');
    const ver={ effective_from:t, kind:sh.querySelector('#rk').value, period:sh.querySelector('#rp').value,
      target:Number(sh.querySelector('#rt').value), unit:sh.querySelector('#ru').value||'ครั้ง',
      step:1, day_threshold:v?.day_threshold??null, fine_mode:sh.querySelector('#rm').value,
      fine:Number(sh.querySelector('#rf').value), changed_by:S.me.id };
    let id = rule?.id;
    if(isNew){
      const nums=S.rules.map(r=>+String(r.id).replace(/\D/g,'')||0);
      id='R'+pad(Math.max(0,...nums)+1);
      const {error}=await sb.from('rules').insert({id,icon:sh.querySelector('#ric').value,name,
        sort_order:(Math.max(0,...S.rules.map(r=>+r.sort_order||0))+1), active:true});
      if(error) return toast('เพิ่มไม่สำเร็จ');
      S.rules.push({id,icon:sh.querySelector('#ric').value,name,sort_order:99,active:true});
    }else{
      await sb.from('rules').update({icon:sh.querySelector('#ric').value,name}).eq('id',id);
      rule.icon=sh.querySelector('#ric').value; rule.name=name;
    }
    ver.rule_id=id;
    const {data,error}=await sb.from('rule_versions').upsert(ver,{onConflict:'rule_id,effective_from'}).select();
    if(error) return toast('บันทึกค่าปรับไม่สำเร็จ');
    S.versions = S.versions.filter(x=>!(x.rule_id===id && String(x.effective_from).slice(0,10)===t)).concat(data);
    sh.remove(); toast('บันทึกแล้ว มีผลตั้งแต่วันนี้'); render();
  };
  sh.onclick=e=>{ if(e.target===sh) sh.remove(); };
  document.body.appendChild(sh);
}
function memberSheet(m){
  const sh=el('<div class="sheet"><div><h3>👤 '+esc(m.name)+'</h3>'+
    '<div class="mini">ใส่อีเมลเพื่อให้อีกฝ่ายล็อกอินเข้าใช้ได้</div><div class="form">'+
    '<div><label>ชื่อที่แสดง</label><input type="text" id="mn" value="'+esc(m.name)+'"></div>'+
    '<div><label>อีเมลสำหรับล็อกอิน</label><input type="email" id="me" value="'+esc(m.email||'')+'" placeholder="fan@example.com"></div>'+
    '<div class="row2"><button class="btn ghost" id="x">ยกเลิก</button><button class="btn" id="ok">บันทึก</button></div>'+
    '</div></div></div>');
  sh.querySelector('#x').onclick=()=>sh.remove();
  sh.querySelector('#ok').onclick=async()=>{
    const name=sh.querySelector('#mn').value.trim()||m.name;
    const email=sh.querySelector('#me').value.trim().toLowerCase()||null;
    const {error}=await sb.from('members').update({name,email}).eq('id',m.id);
    if(error) return toast('บันทึกไม่สำเร็จ');
    m.name=name; m.email=email; sh.remove(); toast('บันทึกแล้ว'); render();
  };
  sh.onclick=e=>{ if(e.target===sh) sh.remove(); };
  document.body.appendChild(sh);
}

/* ══════════════ แท็บ ══════════════ */
$('#nav').addEventListener('click', e=>{
  const b=e.target.closest('button[data-tab]'); if(!b) return; switchTab(b.dataset.tab);
});
$('#hGear').onclick=()=>switchTab('admin');
function switchTab(tab){
  S.tab=tab;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  ['Today','History','Fines','Fund','Admin'].forEach(n=>
    $('#pg'+n).classList.toggle('hide', n.toLowerCase()!==tab));
  render(); scrollTo(0,0);
}

/* ══════════════ ล็อกอิน ══════════════ */
let pendingEmail='';
function authStep(which){
  ['Pw','Email','Otp'].forEach(n=> $('#step'+n).classList.toggle('hide', n!==which));
  $('#authMsg').textContent='';
  $('#authHint').textContent = which==='Pw' ? 'ใส่อีเมลและรหัสผ่าน' : 'ใส่อีเมลเพื่อรับรหัส 6 หลัก';
}
$('#toOtp').onclick=()=>{ $('#email2').value=$('#email').value; authStep('Email'); };
$('#toPw').onclick =()=>authStep('Pw');

async function doSignIn(){
  const em=$('#email').value.trim().toLowerCase(), pw=$('#pw').value;
  if(!/.+@.+\..+/.test(em)) return toast('ใส่อีเมลให้ถูกต้อง');
  if(pw.length<6) return toast('รหัสผ่านอย่างน้อย 6 ตัว');
  $('#signIn').disabled=true; $('#authMsg').textContent='กำลังเข้าสู่ระบบ…';
  const {error}=await sb.auth.signInWithPassword({email:em, password:pw});
  $('#signIn').disabled=false;
  if(error){
    $('#authMsg').textContent = /credential/i.test(error.message)
      ? 'อีเมลหรือรหัสผ่านไม่ถูกต้อง' : 'เข้าไม่ได้: '+error.message;
    return;
  }
  boot();
}
$('#signIn').onclick=doSignIn;
$('#pw').addEventListener('keydown', e=>{ if(e.key==='Enter') doSignIn(); });

$('#sendOtp').onclick=async()=>{
  const em=$('#email2').value.trim().toLowerCase();
  if(!/.+@.+\..+/.test(em)) return toast('ใส่อีเมลให้ถูกต้อง');
  $('#sendOtp').disabled=true; $('#authMsg').textContent='กำลังส่งรหัส…';
  const {error}=await sb.auth.signInWithOtp({email:em});
  $('#sendOtp').disabled=false;
  if(error){
    $('#authMsg').textContent = /rate limit/i.test(error.message)
      ? 'ส่งอีเมลบ่อยเกินไป (โควตาฟรี 2 ฉบับ/ชม.) — รอสักครู่ หรือใช้รหัสผ่านแทน'
      : 'ส่งไม่สำเร็จ: '+error.message;
    return;
  }
  pendingEmail=em;
  authStep('Otp');
  $('#authMsg').textContent='ส่งรหัสไปที่ '+em+' แล้ว — ใช้ "ตัวเลข 6 หลัก" ในอีเมล อย่ากดลิงก์ (เช็กกล่องสแปมด้วย)';
  $('#otp').focus();
};
$('#backEmail').onclick=()=>authStep('Email');
$('#verifyOtp').onclick=async()=>{
  const token=$('#otp').value.trim();
  if(token.length<6) return toast('ใส่รหัส 6 หลัก');
  $('#verifyOtp').disabled=true; $('#authMsg').textContent='กำลังเข้าสู่ระบบ…';
  const {error}=await sb.auth.verifyOtp({email:pendingEmail, token, type:'email'});
  $('#verifyOtp').disabled=false;
  if(error){ $('#authMsg').textContent='รหัสไม่ถูกต้องหรือหมดอายุ'; return; }
  boot();
};

/* ══════════════ เริ่มระบบ ══════════════ */
async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ $('#auth').classList.remove('hide'); $('#app').classList.add('hide'); return; }
  const {data:claim} = await sb.rpc('claim_membership');
  const me = (claim||[])[0];
  if(!me){
    $('#auth').classList.remove('hide');
    $('#authMsg').innerHTML='อีเมลนี้ยังไม่ได้รับเชิญเข้าระบบ<br>ให้แอดมินใส่อีเมลนี้ในหน้าตั้งค่าก่อน<br><br>'+
      '<button class="btn ghost wide" onclick="sb.auth.signOut().then(()=>location.reload())">ออกจากระบบ</button>';
    return;
  }
  S.me = me;
  $('#auth').classList.add('hide'); $('#app').classList.remove('hide');

  if(loadCache()){ S.ready=true; render(); }
  await loadAll();
  render();
  updateOffline(); flush();
  subscribeLive();
  try{ const n = await settleOldPeriods(); if(n) render(); }catch(e){ console.warn(e); }
}
boot();

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
